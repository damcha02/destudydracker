<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;overflow:hidden;background:{{ paperBg }};color:#2b261e">
<div style="position:absolute;inset:0;background:{{ gutter }};pointer-events:none"></div>
<sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:1.4em;right:1.4em;top:1.35em;bottom:2.6em;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));row-gap:.45em">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<div style="min-height:0;display:flex;flex-direction:column;gap:.4em">
<sc-if value="{{ r.hasDate }}" hint-placeholder-val="{{ true }}">
<div style="font:500 .58em/1 'Zen Kaku Gothic New',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6e6352">{{ r.date }}</div>
</sc-if>
<div style="display:flex;gap:.85em;align-items:flex-start;min-height:0">
<div style="position:relative;flex:none;width:2.9em;height:2.9em;background:rgba(95,70,35,.07);box-shadow:0 .06em .12em rgba(60,40,15,.18)">
<img src="{{ r.icon }}" alt="" style="position:absolute;left:.28em;top:.28em;width:calc(100% - .56em);height:calc(100% - .56em);object-fit:contain;mix-blend-mode:multiply">
<span style="position:absolute;left:-.14em;top:-.14em;width:.8em;height:.8em;background:linear-gradient(135deg,#3a332a 50%,rgba(0,0,0,0) 50%)"></span>
<span style="position:absolute;right:-.14em;top:-.14em;width:.8em;height:.8em;background:linear-gradient(225deg,#3a332a 50%,rgba(0,0,0,0) 50%)"></span>
<span style="position:absolute;left:-.14em;bottom:-.14em;width:.8em;height:.8em;background:linear-gradient(45deg,#3a332a 50%,rgba(0,0,0,0) 50%)"></span>
<span style="position:absolute;right:-.14em;bottom:-.14em;width:.8em;height:.8em;background:linear-gradient(315deg,#3a332a 50%,rgba(0,0,0,0) 50%)"></span>
</div>
<div style="min-width:0;display:flex;flex-direction:column;gap:.2em;padding-top:.05em">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.45em;row-gap:0">
<span style="font:600 1.08em/1.15 'Shippori Mincho',serif;letter-spacing:.04em;color:#2b261e">{{ r.jp }}</span>
<span style="font:italic 500 .86em/1.15 'Cormorant Garamond',Georgia,serif;color:#5a5041">{{ r.name }}</span>
</div>
<div style="font:400 .62em/1.4 'Zen Kaku Gothic New',sans-serif;color:#5a5041;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ r.desc }}</div>
</div>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:1.6em;right:1.6em;top:0;bottom:2.6em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5em;text-align:center">
<div style="font:500 1em/1.3 'Shippori Mincho',serif;color:#2b261e">The album is empty.</div>
<div style="font:400 .72em/1.5 'Zen Kaku Gothic New',sans-serif;color:#5a5041;text-wrap:pretty">Achievements are mounted here as you earn them.</div>
</div>
</sc-if>
<div style="position:absolute;left:0;right:0;bottom:1.05em;text-align:center;font:400 .64em/1 'Shippori Mincho',serif;color:#6e6352">{{ num }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#eee5cf&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.page;
    const left = p ? p.left : true;
    const paper = this.props.paper || "#eee5cf";
    const g = left
      ? "linear-gradient(to left, rgba(70,45,18,.34), rgba(70,45,18,.13) 4%, rgba(70,45,18,0) 13%, rgba(255,250,235,.16) 30%, rgba(0,0,0,0) 55%), linear-gradient(to right, rgba(70,45,18,.09), rgba(0,0,0,0) 3%)"
      : "linear-gradient(to right, rgba(70,45,18,.34), rgba(70,45,18,.13) 4%, rgba(70,45,18,0) 13%, rgba(255,250,235,.16) 30%, rgba(0,0,0,0) 55%), linear-gradient(to left, rgba(70,45,18,.09), rgba(0,0,0,0) 3%)";
    return {
      paperBg: "radial-gradient(ellipse 55% 35% at " + (left ? "20% 82%" : "80% 16%") + ", rgba(160,115,55,.08), rgba(0,0,0,0) 70%), repeating-linear-gradient(0deg, rgba(120,90,40,.025) 0 1px, rgba(0,0,0,0) 1px 3px), " + paper,
      gutter: g,
      hasRows: !!(p && p.rows && p.rows.length),
      rows: (p && p.rows) || [],
      isEmpty: !!(p && p.empty),
      num: p ? String(p.num) : ""
    };
  }
}
</script>
</body>
</html>
