<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:300},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;dataset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;few&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'few'|'empty'&quot;},&quot;reducedMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const A = "assets/";
const DATA = [
  { name: "Deep water", jp: "深水", desc: "One unbroken session of 90 minutes.", date: "2026-06-21", icon: A + "g-pond.png" },
  { name: "Old pine", jp: "老松", desc: "Among the first to keep a study log here.", icon: A + "g-pine.png" },
  { name: "First session", jp: "初心", desc: "Logged your first focused session.", date: "2026-06-02", icon: A + "plant-moss.png" },
  { name: "Early light", jp: "曙光", desc: "Started three sessions before 7 am.", date: "2026-06-14", icon: A + "g-lantern-small.png" },
  { name: "Steady hand", jp: "継続", desc: "Five days in a row with at least one session.", date: "2026-06-05", icon: A + "plant-bamboo.png" },
  { name: "Clean slate", jp: "白紙", desc: "Closed every task on a week's plan.", date: "2026-06-30", icon: A + "g-stone-slab.png" },
  { name: "Cherry year", jp: "桜の年", desc: "Used the app through one full semester.", icon: A + "plant-cherry.png" },
  { name: "Hundred hours", jp: "百時間", desc: "100 hours of study logged in total.", date: "2026-07-08", icon: A + "plant-pine.png" },
  { name: "Quiet week", jp: "静かな週", desc: "Seven days without skipping a break.", date: "2026-07-19", icon: A + "g-hut.png" },
  { name: "Exam ready", jp: "備え", desc: "Finished a full summary before its exam.", date: "2026-07-27", icon: A + "plant-iris.png" },
  { name: "Bridge", jp: "橋", desc: "Linked notes across two subjects.", date: "2026-08-04", icon: A + "g-bridge.png" },
  { name: "Moss garden", jp: "苔庭", desc: "Planted twelve subjects in the garden.", icon: A + "g-rock-mossy.png" },
  { name: "Mid-season", jp: "盛夏", desc: "Kept a streak through a public holiday.", date: "2026-08-15", icon: A + "plant-maple.png" },
  { name: "Long rain", jp: "長雨", desc: "Studied through ten grey days in a row.", date: "2026-09-02", icon: A + "plant-hosta.png" }
];
const SETS = {
  full: DATA,
  few: DATA.filter(d => ["First session", "Steady hand", "Old pine"].includes(d.name)),
  empty: []
};
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmt = d => { const [y, m, dd] = d.split("-").map(Number); return dd + " " + MON[m - 1] + " " + y; };
function buildPages(items) {
  const dated = items.filter(i => i.date).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const undated = items.filter(i => !i.date).sort((a, b) => a.name.localeCompare(b.name));
  const rows = dated.concat(undated).map(i => ({ hasDate: !!i.date, date: i.date ? fmt(i.date) : "", name: i.name, jp: i.jp || i.name, desc: i.desc, icon: i.icon }));
  const pages = [];
  for (let i = 0; i < rows.length; i += 3) pages.push({ rows: rows.slice(i, i + 3) });
  if (!pages.length) pages.push({ rows: [], empty: true });
  if (pages.length % 2) pages.push({ rows: [] });
  return pages.map((p, i) => Object.assign(p, { num: i + 1, left: i % 2 === 0 }));
}
const wood = (c, lamp, vig) => [
  "radial-gradient(ellipse 70% 60% at 42% 38%, rgba(255,232,190," + lamp + "), rgba(255,232,190,0) 70%)",
  "radial-gradient(ellipse 120% 95% at 50% 50%, rgba(0,0,0,0) 50%, rgba(30,15,3," + vig + "))",
  "radial-gradient(ellipse 90px 20px at 17% 20%, rgba(55,28,8,.55) 0 5%, rgba(0,0,0,0) 13%, rgba(55,28,8,.2) 19%, rgba(0,0,0,0) 27%, rgba(55,28,8,.15) 37%, rgba(0,0,0,0) 47%, rgba(55,28,8,.1) 60%, rgba(0,0,0,0) 76%)",
  "radial-gradient(ellipse 64px 13px at 62% 86%, rgba(55,28,8,.45) 0 6%, rgba(0,0,0,0) 15%, rgba(55,28,8,.16) 23%, rgba(0,0,0,0) 33%, rgba(55,28,8,.1) 46%, rgba(0,0,0,0) 64%)",
  "linear-gradient(180deg, rgba(0,0,0,0) calc(34% - 1px), rgba(30,14,3,.45) calc(34% - 1px) 34%, rgba(255,230,190,.08) 34% calc(34% + 1px), rgba(0,0,0,0) calc(34% + 1px) calc(70% - 1px), rgba(30,14,3,.45) calc(70% - 1px) 70%, rgba(255,230,190,.08) 70% calc(70% + 1px), rgba(0,0,0,0) calc(70% + 1px))",
  "repeating-linear-gradient(179.3deg, rgba(60,32,10,.10) 0 1px, rgba(0,0,0,0) 1px 5px)",
  "repeating-linear-gradient(180.8deg, rgba(60,32,10,.08) 0 2px, rgba(0,0,0,0) 2px 11px)",
  "repeating-linear-gradient(179.7deg, rgba(255,235,200,.05) 0 3px, rgba(0,0,0,0) 3px 23px)",
  "repeating-linear-gradient(180.3deg, rgba(70,38,12,.12) 0 7px, rgba(0,0,0,0) 7px 41px, rgba(70,38,12,.07) 41px 44px, rgba(0,0,0,0) 44px 67px)",
  "linear-gradient(90deg, rgba(0,0,0,.06), rgba(255,255,255,.03) 40%, rgba(0,0,0,.07))",
  "linear-gradient(180deg, " + c[0] + " 0 34%, " + c[1] + " 34% 70%, " + c[2] + " 70%)"
