name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rustTargets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rustTargets: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            rustTargets: ""
          - platform: windows-latest
            args: "--bundles nsis,msi"
            rustTargets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SOCIAL_API_URL: "https://study-tracker-social.danil-poluyanov13.workers.dev"
          STUDY_TRACKER_OFFICIAL_RELEASE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Study Tracker ${{ github.ref_name }}"
          releaseBody: "Download the installer for your operating system."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
